# nginx site for mtg.ojee.net (the static client) on disinteg.
# Installed at /etc/nginx/sites-enabled/mtg-frontend (a plain file there, not
# a symlink; sites-available holds a copy). This copy is the record; editing it
# changes nothing until it's installed (sudo cp to both, then
# `sudo nginx -t && sudo systemctl reload nginx`).
# The API, mtg-api.ojee.net, is the separate `mtg` site.

server {
    listen 80;
    listen [::]:80;
    server_name mtg.ojee.net;

    root /home/disinteg/mtg-client;
    index index.html;

    # The build's hashed files never change under the same name, so they can
    # be cached for good - and a missing one is a 404. Falling back to
    # index.html here would hand the browser HTML where it asked for a script.
    location /static/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # The page is always revalidated, so a deploy is picked up on the next
    # load instead of whenever a heuristic cache expires.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Client-side routes (/invite/CODE, /share/CODE) serve the app; that
    # internal redirect lands in the /index.html block above.
    location / {
        try_files $uri /index.html;
    }
}
